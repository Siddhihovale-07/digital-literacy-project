{% extends "base.html" %}
{% block title %}Feedback | Digital Literacy CEP{% endblock %}
{% block content %}
<section class="page-header compact">
    <span class="eyebrow">PARTICIPANT FEEDBACK</span>
    <h1>How was the training?</h1>
    <p>Your feedback helps students understand whether the training was useful.</p>
</section>

<form class="form-card narrow" method="POST">
    <label>Participant Name
        <input type="text" name="participant_name" placeholder="Enter name" required>
    </label>

    <label>Training Rating</label>
    <div class="rating-row">
        {% for n in range(1,6) %}
        <label><input type="radio" name="rating" value="{{ n }}" required> {{ n }} ⭐</label>
        {% endfor %}
    </div>

    <label>What did you find useful?
        <textarea name="comment" rows="5" placeholder="Write a short comment"></textarea>
    </label>

    <button class="btn primary" type="submit">Submit Feedback</button>
</form>
{% endblock %}
